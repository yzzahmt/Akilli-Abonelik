
def newBuildDir = rootProject.layout.buildDirectory.dir("../../build").get()
rootProject.layout.buildDirectory.set(newBuildDir)

subprojects {
    def newSubprojectBuildDir = newBuildDir.dir(project.name)
    project.layout.buildDirectory.set(newSubprojectBuildDir)
}
subprojects {
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.layout.buildDirectory
}

// Force stable glance versions — home_widget pulls 1.3.0-alpha01 which requires AGP 9.1.0
subprojects {
    project.configurations.all {
        resolutionStrategy {
            force 'androidx.glance:glance-appwidget:1.1.1'
            force 'androidx.glance:glance:1.1.1'
            force 'androidx.glance:glance-material3:1.1.1'
        }
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url 'https://storage.googleapis.com/download.flutter.io' }
    }
}

